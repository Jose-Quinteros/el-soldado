<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Apoyo Universitario Multidisciplinario de Alto Nivel</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-hover: #334155;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.2);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #475569;
            --tag-bg: #0284c7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 2rem;
        }

        header {
            max-width: 1200px;
            margin: 0 auto 2.5rem auto;
            text-align: center;
        }

        header h1 {
            font-size: 2.2rem;
            color: var(--accent);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
            max-width: 800px;
            margin: 0 auto;
        }

        .search-container {
            max-width: 1200px;
            margin: 0 auto 2rem auto;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        #searchBar {
            flex: 1;
            min-width: 280px;
            padding: 0.8rem 1.2rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        #searchBar:focus {
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .grid-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, background-color 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-4px);
            background-color: var(--card-hover);
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }

        .card-header {
            margin-bottom: 1rem;
        }

        .card-title {
            font-size: 1.25rem;
            color: var(--accent);
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .card-description {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
        }

        .topics-list {
            list-style: none;
            margin-bottom: 1.2rem;
        }

        .topics-list li {
            font-size: 0.85rem;
            background-color: rgba(255,255,255,0.05);
            margin-bottom: 0.3rem;
            padding: 0.3rem 0.6rem;
            border-radius: 4px;
            color: #cbd5e1;
        }

        .ai-tools {
            border-top: 1px solid var(--border-color);
            padding-top: 1rem;
            margin-top: auto;
        }

        .ai-tools-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            margin-bottom: 0.5rem;
        }

        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .ai-link {
            display: inline-block;
            background-color: var(--tag-bg);
            color: #fff;
            text-decoration: none;
            font-size: 0.75rem;
            padding: 0.3rem 0.6rem;
            border-radius: 6px;
            font-weight: 600;
            transition: opacity 0.2s, transform 0.1s;
        }

        .ai-link:hover {
            opacity: 0.85;
            transform: scale(1.03);
        }

        footer {
            max-width: 1200px;
            margin: 3rem auto 0 auto;
            text-align: center;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Sistema Multidisciplinario de Apoyo Universitario</h1>
        <p>Plataforma integral de aprendizaje, investigación, análisis crítico e inteligencia artificial complementaria.</p>
    </header>

    <div class="search-container">
        <input type="text" id="searchBar" placeholder="Buscar por disciplina, método, concepto o herramienta de IA (ej: Criminología, Python, Perplexity)...">
    </div>

    <main class="grid-container" id="gridContainer">
        <!-- Las tarjetas se generan dinámicamente mediante JavaScript -->

            },
            {

                temas: ["Encabezado Metodológico Obligatorio", "Formatos de Cita Científica", "Sección Final de Garantía Académica"],
                herramientas: ["ChatGPT", "Claude", "NotebookLM"]
            }
        ];

        // Función para renderizar las tarjetas en la interfaz
        function renderCards(data) {
            const container = document.getElementById('gridContainer');
            container.innerHTML = '';

            if (data.length === 0) {
                container.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 2rem;">No se encontraron disciplinas o herramientas que coincidan con la búsqueda.</p>';
                return;
            }

            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';

                // Generar los botones con los enlaces de IA correspondientes
                const toolsHTML = item.herramientas.map(tool => {
                    const url = AI_URLS[tool] || '#';
                    return `<a href="${url}" target="_blank" rel="noopener noreferrer" class="ai-link">${tool}</a>`;
                }).join('');

                // Generar la lista de temas
                const topicsHTML = item.temas.map(tema => `<li>• ${tema}</li>`).join('');

                card.innerHTML = `
                    <div>
                        <div class="card-header">
                            <h2 class="card-title">${item.id}. ${item.nombre}</h2>
                            <p class="card-description">${item.descripcion}</p>
                        </div>
                        <ul class="topics-list">
                            ${topicsHTML}
                        </ul>
                    </div>
                    <div class="ai-tools">
                        <div class="ai-tools-title">Herramientas IA Sugeridas:</div>
                        <div class="tags-container">
                            ${toolsHTML}
                        </div>
                    </div>
                `;

                container.appendChild(card);
            });
        }

        // Sistema de búsqueda y filtrado dinámico
        document.getElementById('searchBar').addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const filtered = disciplinas.filter(d => {
                const matchNombre = d.nombre.toLowerCase().includes(searchTerm);
                const matchDesc = d.descripcion.toLowerCase().includes(searchTerm);
                const matchTemas = d.temas.some(t => t.toLowerCase().includes(searchTerm));
                const matchTools = d.herramientas.some(h => h.toLowerCase().includes(searchTerm));
                
                return matchNombre || matchDesc || matchTemas || matchTools;
            });
            renderCards(filtered);
        });

        // Carga inicial
        renderCards(disciplinas);
    </script>
</body>
</html>
