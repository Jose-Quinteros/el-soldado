<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI WORLD HUB — Administración local</title>
<style>
body{font-family:system-ui;background:#08111f;color:#eef5ff;margin:0}.wrap{max-width:1000px;margin:auto;padding:28px}.panel{background:#0f1c30;border:1px solid #263957;border-radius:16px;padding:20px;margin:15px 0}input,textarea,select{width:100%;box-sizing:border-box;margin:6px 0 12px;padding:10px;border-radius:8px;border:1px solid #304463;background:#0a1526;color:#fff}button{padding:10px 14px;border:0;border-radius:9px;cursor:pointer;margin:4px;background:#67e8f9;font-weight:800}.danger{background:#fb7185}.muted{color:#9db0c9}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:650px){.row{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<h1>🤖 AI WORLD HUB — Administración local</h1>
<p class="muted">Este panel modifica únicamente el catálogo guardado en <code>localStorage</code> del navegador. No es un sistema multiusuario.</p>
<div class="panel"><h2>Agregar IA</h2><div class="row"><label>Nombre<input id="name"></label><label>Empresa<input id="company"></label></div><label>URL oficial<input id="url" placeholder="https://..."></label><label>Descripción<textarea id="desc"></textarea></label><div class="row"><label>Categorías<input id="cats" placeholder="Programación, Asistentes"></label><label>Especialidades<input id="specs" placeholder="Código, Web"></label></div><div class="row"><label>Precio<select id="price"><option>Gratis</option><option>Freemium</option><option>Pago</option><option>Enterprise</option></select></label><label>Gratuita<select id="free"><option value="true">Sí</option><option value="false">No</option></select></label></div><div class="row"><label>Potencia<input id="pot" type="number" min="0" max="100" value="80"></label><label>Calidad<input id="qual" type="number" min="0" max="100" value="80"></label></div><div class="row"><label>Versatilidad<input id="vers" type="number" min="0" max="100" value="80"></label><label>Facilidad<input id="easy" type="number" min="0" max="100" value="80"></label></div><div class="row"><label>Popularidad<input id="pop" type="number" min="0" max="100" value="70"></label><label>Innovación<input id="innov" type="number" min="0" max="100" value="80"></label></div><button id="add">Agregar al catálogo local</button><button onclick="window.location.href='index.html'">Volver al Hub</button></div>
<div class="panel"><h2>Importar / Exportar</h2><input type="file" id="file" accept=".json"><button id="import">Importar JSON</button><button id="export">Exportar catálogo</button><button class="danger" id="clear">Eliminar IA personalizadas</button></div>
<div class="panel"><h2>IA personalizadas</h2><div id="list"></div></div>
</div>
<script>
const KEY="aiwh_custom";const get=()=>JSON.parse(localStorage.getItem(KEY)||"[]");const set=x=>localStorage.setItem(KEY,JSON.stringify(x));
function render(){let a=get();document.querySelector("#list").innerHTML=a.length?a.map(x=>`<div style="padding:10px;border-bottom:1px solid #263957"><b>${x.nombre}</b> — ${x.empresa} <button class="danger" onclick="del('${x.id}')">Eliminar</button></div>`).join(""):"<span class='muted'>No hay registros personalizados.</span>"}
function del(id){set(get().filter(x=>x.id!==id));render()}
document.querySelector("#add").onclick=()=>{let v=id=>document.querySelector("#"+id).value.trim();let x={id:"custom-"+Date.now(),nombre:v("name"),empresa:v("company"),url:v("url"),descripcion:v("desc"),categorias:v("cats").split(",").map(s=>s.trim()).filter(Boolean),especialidades:v("specs").split(",").map(s=>s.trim()).filter(Boolean),precio:v("price"),gratuita:v("free")==="true",api:false,plataformas:["Web"],potencia:+v("pot"),calidad:+v("qual"),versatilidad:+v("vers"),facilidad:+v("easy"),popularidad:+v("pop"),innovacion:+v("innov"),fechaActualizacion:new Date().toISOString().slice(0,10),tags:v("specs").toLowerCase().split(",").map(s=>s.trim()).filter(Boolean),verificada:false,destacada:false};if(!x.nombre||!x.url){alert("Nombre y URL oficial son obligatorios.");return}let a=get();a.push(x);set(a);render();alert("IA agregada al catálogo local.")}
document.querySelector("#export").onclick=()=>{let blob=new Blob([JSON.stringify(get(),null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="ai-world-hub.json";a.click();URL.revokeObjectURL(a.href)}
document.querySelector("#import").onclick=async()=>{let f=document.querySelector("#file").files[0];if(!f)return alert("Selecciona un JSON.");try{let incoming=JSON.parse(await f.text());if(!Array.isArray(incoming))throw Error();set([...get(),...incoming]);render();alert("Importación realizada.")}catch(e){alert("JSON inválido.")}}
document.querySelector("#clear").onclick=()=>{if(confirm("¿Eliminar todas las IA personalizadas?")){set([]);render()}};render();window.del=del;
</script></body></html>
