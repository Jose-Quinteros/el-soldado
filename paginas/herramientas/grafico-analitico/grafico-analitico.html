<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiAsistente de Datos - Enterprise Analytics Pro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white">

    <!-- Barra Superior Profesional / Navbar Institucional -->
    <header class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 px-6 lg:px-10 py-4 flex justify-between items-center sticky top-0 z-40">
        <div class="flex items-center space-x-3">
            <div class="bg-gradient-to-tr from-indigo-600 to-violet-500 text-white w-10 h-10 rounded-xl flex items-center justify-center font-bold text-lg shadow-lg shadow-indigo-500/20 ring-1 ring-white/10">
                <i class="fa-solid fa-chart-pie"></i>
            </div>
            <div>
                <h1 class="font-bold text-slate-100 text-base tracking-wide flex items-center gap-2">
                    MiAsistente de Datos <span class="text-[10px] bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 px-2 py-0.5 rounded-full font-mono uppercase">Pro v2.5</span>
                </h1>
                <p class="text-xs text-slate-400 font-medium">Plataforma de Inteligencia y Análisis Cuantitativo</p>
            </div>
        </div>
        <div class="flex items-center space-x-3">
            <span id="status-badge" class="bg-amber-500/10 border border-amber-500/20 text-amber-400 text-xs font-semibold px-3 py-1.5 rounded-full flex items-center gap-1.5 shadow-xs">
                <i class="fa-solid fa-circle text-[7px] animate-pulse"></i> Sin datos procesados
            </span>
        </div>
    </header>

    <!-- Contenedor Principal (Wizard / Workflow) -->
    <main class="flex-1 max-w-6xl w-full mx-auto p-4 sm:p-6 lg:p-8 space-y-6">
        
        <!-- Pestañas de Navegación Visuales / Stepper -->
        <div class="grid grid-cols-1 sm:grid-cols-4 gap-2 bg-slate-800/60 p-2 rounded-2xl shadow-xl border border-slate-700/60 backdrop-blur-sm">
            <button onclick="changeStep(1)" id="tab-1" class="step-tab flex items-center justify-center space-x-2.5 py-3 px-4 rounded-xl text-xs sm:text-sm font-semibold transition bg-indigo-600 text-white shadow-md shadow-indigo-600/25">
                <i class="fa-solid fa-file-pen"></i> <span>1. Ingresar Datos</span>
            </button>
            <button onclick="changeStep(2)" id="tab-2" class="step-tab flex items-center justify-center space-x-2.5 py-3 px-4 rounded-xl text-xs sm:text-sm font-semibold transition text-slate-400 hover:text-slate-200 hover:bg-slate-700/50">
                <i class="fa-solid fa-wand-magic-sparkles"></i> <span>2. ¿Qué está pasando?</span>
            </button>
            <button onclick="changeStep(3)" id="tab-3" class="step-tab flex items-center justify-center space-x-2.5 py-3 px-4 rounded-xl text-xs sm:text-sm font-semibold transition text-slate-400 hover:text-slate-200 hover:bg-slate-700/50">
                <i class="fa-solid fa-chart-pie"></i> <span>3. Mis Gráficos</span>
            </button>
            <button onclick="changeStep(4)" id="tab-4" class="step-tab flex items-center justify-center space-x-2.5 py-3 px-4 rounded-xl text-xs sm:text-sm font-semibold transition text-slate-400 hover:text-slate-200 hover:bg-slate-700/50">
                <i class="fa-solid fa-file-arrow-down"></i> <span>4. Reporte Amigable</span>
            </button>
        </div>

        <!-- Contenedor Dinámico de los Pasos -->
        <div class="bg-slate-800/40 border border-slate-700/60 rounded-3xl p-6 sm:p-8 shadow-2xl backdrop-blur-md min-h-[460px] relative overflow-hidden" id="step-content">
            <!-- Inyectado por app.js -->
        </div>
    </main>

    <!-- Footer Institucional -->
    <footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500 no-print">
        <p>MiAsistente de Datos &copy; 2026 — Entorno de Análisis Cuantitativo Institucional</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
