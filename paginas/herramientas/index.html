<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Herramientas del Soldado - Panel Central</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Encabezado Principal -->
    <header class="main-header">
        <div class="header-container">
            <div class="logo-area">
                <span class="header-icon">🛡️</span>
                <h1>UTILIDADES DEL SOLDADO</h1>
            </div>
            <p class="header-subtitle">Utilidades y recursos frecuentes.</p>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="main-container">
        <!-- Barra de Búsqueda y Filtros -->
        <section class="control-panel">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="Buscar herramienta por nombre o descripción...">
            </div>
            
            <div class="filter-categories" id="filterCategories">
                <button class="filter-btn active" data-category="todas">TODAS</button>
                <button class="filter-btn" data-category="analisis">CONTROL DE EVENTOS</button>
                <button class="filter-btn" data-category="consultas">ELIMINACION DE DUPLICADOS</button>
                <button class="filter-btn" data-category="utilidades">UTILIDADES</button>
                <button class="filter-btn" data-category="recursos">RECURSOS</button>
                <button class="filter-btn" data-category="externo">EXTERNOS</button>
                <button class="filter-btn" data-category="nueva-categoria">NUEVA CATEGORÍA</button>
            </div>
        </section>

        <!-- Grid de Herramientas (Generado Dinámicamente) -->
        <section class="tools-grid" id="toolsGrid">
            <!-- Las tarjetas se inyectan dinámicamente mediante JavaScript -->
        </section>

        <!-- Mensaje de sin resultados -->
        <div id="noResults" class="no-results hidden">
            <p>No se encontraron herramientas que coincidan con la búsqueda.</p>
        </div>
    </main>

    <!-- Pie de Página -->
    <footer class="main-footer">
        <p>&copy; 2026 Herramientas del Soldado. Sistema Centralizado de Operaciones y Análisis.</p>
    </footer>

    <!-- Script de Funcionalidad -->
    <script src="js/app.js"></script>
</body>
</html>
