<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Analítico Profesional - Reportes Técnicos</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Estilos Personalizados -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <!-- ENCABEZADO -->
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600/20 border border-indigo-500/30 p-2 rounded-xl text-indigo-400">
                    <i class="fa-solid fa-chart-line text-lg"></i>
                </div>
                <div>
                    <h1 class="font-extrabold text-sm sm:text-base tracking-tight text-slate-100">Analizador y Generador de Reportes Técnicos</h1>
                    <p class="text-[11px] text-slate-400">Plataforma de procesamiento estadístico e informes automatizados</p>
                </div>
            </div>
            <div id="status-badge" class="bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 text-xs font-semibold px-3 py-1.5 rounded-full flex items-center gap-1.5 shadow-xs">
                <i class="fa-solid fa-circle text-[7px]"></i> Sistema Activo
            </div>
        </div>
    </header>

    <!-- NAVEGACIÓN POR PASOS (TABS) -->
    <nav class="max-w-5xl mx-auto px-4 w-full mt-6">
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 bg-slate-900/80 p-1.5 rounded-2xl border border-slate-800 shadow-lg">
            <button onclick="changeStep(1)" id="tab-1" class="step-tab flex items-center justify-center space-x-2.5 py-3 px-4 rounded-xl text-xs sm:text-sm font-semibold transition bg-indigo-600 text-white shadow-md shadow-indigo-600/25">
                <i class="fa-solid fa-table"></i>
                <span>1. Datos</span>
            </button>
            <button onclick="changeStep(2)" id="tab-2" class="step-tab flex items-center justify-center space-x-2.5 py-3 px-4 rounded-xl text-xs sm:text-sm font-semibold transition text-slate-400 hover:text-slate-200 hover:bg-slate-800/50">
                <i class="fa-solid fa-magnifying-glass-chart"></i>
                <span>2. Diagnóstico</span>
            </button>
            <button onclick="changeStep(3)" id="tab-3" class="step-tab flex items-center justify-center space-x-2.5 py-3 px-4 rounded-xl text-xs sm:text-sm font-semibold transition text-slate-400 hover:text-slate-200 hover:bg-slate-800/50">
                <i class="fa-solid fa-chart-column"></i>
                <span>3. Gráficos</span>
            </button>
            <button onclick="changeStep(4)" id="tab-4" class="step-tab flex items-center justify-center space-x-2.5 py-3 px-4 rounded-xl text-xs sm:text-sm font-semibold transition text-slate-400 hover:text-slate-200 hover:bg-slate-800/50">
                <i class="fa-solid fa-file-lines"></i>
                <span>4. Reporte e Historial</span>
            </button>
        </div>
    </nav>

    <!-- CONTENEDOR PRINCIPAL DINÁMICO -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full flex-grow">
        <div id="step-content">
            <!-- Inyectado dinámicamente por app.js -->
        </div>
    </main>

    <!-- PIE DE PÁGINA -->
    <footer class="border-t border-slate-800 bg-slate-900/30 py-4 text-center text-xs text-slate-500 no-print">
        <p>Sistema de Analítica y Gestión de Reportes Estadísticos © 2026</p>
    </footer>

    <!-- VINCULACIÓN DEL SCRIPT -->
    <script src="app.js"></script>
</body>
</html>
